<router-outlet></router-outlet>

@if (toastService.toast(); as t) {
  <div
    class="fixed top-5 right-5 z-[9999] flex items-center gap-3.5 px-4 py-3.5 rounded-xl border-2 w-full max-w-md bg-white text-gray-900 shadow-sm animate-fade-in"
    [ngClass]="{
      'border-emerald-600': t.tipo === 'success',
      'border-rose-600': t.tipo === 'error',
      'border-blue-600': t.tipo === 'info',
      'border-amber-600': t.tipo === 'warning'
    }"
  >
    <span class="material-icons text-xl shrink-0"
          [ngClass]="{
        'text-emerald-600': t.tipo === 'success',
        'text-rose-600': t.tipo === 'error',
        'text-blue-600': t.tipo === 'info',
        'text-amber-600': t.tipo === 'warning'
      }">
      {{ t.tipo === 'success' ? 'check_circle' : t.tipo === 'error' ? 'error' : t.tipo === 'info' ? 'info' : 'warning' }}
    </span>

    <span class="text-sm font-semibold leading-tight flex-1 text-gray-800">{{ t.mensaje }}</span>

    <button
      type="button"
      (click)="toastService.toast.set(null)"
      class="p-1 rounded text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors shrink-0"
    >
      <span class="material-icons text-base block">close</span>
    </button>
  </div>
}

@if (toastService.confirmacion(); as conf) {
  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center z-[9999] animate-fade-in">
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-xl max-w-md w-full mx-4 space-y-4">
      <div class="flex items-start gap-3.5">
        <div class="p-2.5 bg-rose-50 rounded-lg text-rose-600 border border-rose-100 shrink-0">
          <span class="material-icons block text-2xl">warning</span>
        </div>
        <div class="space-y-1">
          <h3 class="text-base font-bold text-gray-900">{{ conf.titulo }}</h3>
          <p class="text-sm text-gray-500 leading-normal font-medium">{{ conf.mensaje }}</p>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="toastService.cancelarConfirmacion()"
          class="px-4 py-2.5 text-xs font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors border border-gray-200 uppercase tracking-wider"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="toastService.aceptarConfirmacion()"
          class="px-4 py-2.5 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg transition-all shadow-sm shadow-rose-600/10 uppercase tracking-wider"
        >
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
}
