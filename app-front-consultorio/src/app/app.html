<router-outlet></router-outlet>

<!-- Toast Notificación -->
@if (toastService.toast(); as t) {
  <div
    class="fixed top-5 right-5 z-[9999] flex items-start gap-3 px-4 py-3.5 rounded border bg-white shadow-sm animate-fade-in w-full max-w-sm"
    [ngClass]="{
      'border-teal-200 bg-teal-50/30': t.tipo === 'success',
      'border-red-200 bg-red-50/30': t.tipo === 'error',
      'border-slate-200 bg-slate-50/30': t.tipo === 'info',
      'border-amber-200 bg-amber-50/30': t.tipo === 'warning'
    }"
  >
    <!-- Iconos Vectoriales SVG Puros -->
    <div class="shrink-0 mt-0.5">
      <!-- Éxito -->
      <svg *ngIf="t.tipo === 'success'" class="h-5 w-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <!-- Error -->
      <svg *ngIf="t.tipo === 'error'" class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <!-- Info -->
      <svg *ngIf="t.tipo === 'info'" class="h-5 w-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <!-- Advertencia -->
      <svg *ngIf="t.tipo === 'warning'" class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <!-- Contenido del Texto -->
    <div class="flex-1">
      <p class="text-xs font-bold uppercase tracking-wider mb-0.5"
         [ngClass]="{
           'text-teal-800': t.tipo === 'success',
           'text-red-800': t.tipo === 'error',
           'text-slate-800': t.tipo === 'info',
           'text-amber-800': t.tipo === 'warning'
         }">
        {{ t.tipo === 'success' ? 'Éxito' : t.tipo === 'error' ? 'Error' : t.tipo === 'warning' ? 'Advertencia' : 'Información' }}
      </p>
      <p class="text-sm text-slate-700 leading-snug font-medium">{{ t.mensaje }}</p>
    </div>

    <!-- Botón Cerrar -->
    <button
      type="button"
      (click)="toastService.toast.set(null)"
      class="p-1 rounded text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors shrink-0"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
}

<!-- Alerta de Confirmación (Modal de Eliminación u operaciones críticas) -->
@if (toastService.confirmacion(); as conf) {
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[9999] animate-fade-in">
    <div class="bg-white rounded border border-slate-200 p-5 shadow-sm max-w-sm w-full mx-4 space-y-4">
      <div class="flex items-start gap-3.5">
        <div class="p-2 bg-red-50 text-red-600 border border-red-100 rounded shrink-0">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </div>
        <div class="space-y-1">
          <h3 class="text-sm font-bold text-slate-900">{{ conf.titulo }}</h3>
          <p class="text-sm text-slate-500 leading-normal font-medium">{{ conf.mensaje }}</p>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex items-center justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="toastService.cancelarConfirmacion()"
          class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50 rounded border border-slate-200 transition-colors uppercase tracking-wider"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="toastService.aceptarConfirmacion()"
          class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded transition-colors uppercase tracking-wider"
        >
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
