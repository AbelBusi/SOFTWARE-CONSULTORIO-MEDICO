<div class="flex min-h-screen bg-gray-50 font-sans">

  <aside
    class="bg-white border-r border-gray-200 flex flex-col transition-all duration-200 shrink-0"
    [class.w-60]="open"
    [class.w-16]="!open"
  >

    <div
      class="flex items-center h-16 border-b border-gray-200 mb-4"
      [class.justify-between]="open"
      [class.px-5]="open"
      [class.justify-center]="!open"
    >
      @if(open) {
        <span class="text-green-700 font-semibold text-base tracking-tight">
          Clínica
          <span class="text-gray-400 font-normal">Pro</span>
        </span>
      }

      <button
        (click)="toggleSidebar()"
        class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
      >
        <span class="material-icons text-xl block">menu</span>
      </button>
    </div>

    <div class="px-3 mb-4">
      <div
        class="flex flex-col items-center py-4 rounded-xl transition-all"
        [class.bg-gray-50]="open"
        [class.border]="open"
        [class.border-gray-100]="open"
      >
        <div class="relative">
          <div
            class="rounded-full bg-green-700 flex items-center justify-center text-white font-bold transition-all"
            [class.w-14]="open"
            [class.h-14]="open"
            [class.w-10]="!open"
            [class.h-10]="!open"
          >
            JP
          </div>
          <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
        </div>

        @if(open) {
          <div class="mt-3 text-center animate-in fade-in duration-200">
            <p class="text-sm font-bold text-gray-800">Juan Pérez</p>
            <p class="text-[10px] font-medium text-gray-400 uppercase mt-1 tracking-wider">
              Administrador
            </p>
          </div>
        }
      </div>
    </div>

    <nav class="flex-1 py-3 overflow-y-auto space-y-1">
      @for(item of navItems; track item.label) {
        <div>
          <button
            (click)="toggleMenu(item.label)"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-50 transition-colors"
            [class.justify-center]="!open"
          >
            <span class="material-icons text-gray-400">
              {{ item.icon }}
            </span>

            @if(open) {
              <span class="flex-1 text-left font-medium">
                {{ item.label }}
              </span>
              @if(item.sub) {
                <span
                  class="material-icons text-gray-400 text-sm transition-transform duration-200"
                  [class.rotate-90]="expandedItem === item.label"
                >
                  chevron_right
                </span>
              }
            }
          </button>

          @if(item.sub && expandedItem === item.label && open) {
            <div class="ml-9 border-l border-gray-200 pl-3 my-1 space-y-1 animate-in fade-in slide-in-from-top-1 duration-150">
              @for(sub of item.sub; track sub.label) {
                <a
                  [routerLink]="sub.route"
                  routerLinkActive="text-green-700 font-semibold bg-green-50/50"
                  class="w-full flex items-center gap-2 px-3 py-2 text-xs rounded-md text-gray-500 hover:text-gray-800 hover:bg-gray-50 transition-colors"
                >
                  {{ sub.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>

    <div class="p-3 border-t border-gray-100 flex flex-col gap-1">
      <button
        class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-500 hover:bg-gray-50 rounded-md transition-colors"
        [class.justify-center]="!open"
      >
        <span class="material-icons text-gray-400 text-lg">settings</span>
        @if(open) {
          <span>Configuración</span>
        }
      </button>

      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors"
        [class.justify-center]="!open"
      >
        <span class="material-icons text-lg">logout</span>
        @if(open) {
          <span class="font-medium">Cerrar sesión</span>
        }
      </button>
    </div>

  </aside>

  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold mb-0.5">
          Dashboard
        </p>
        <h1 class="text-lg font-bold text-gray-900">
          Panel administrativo
        </h1>
      </div>

      <button class="relative p-2 text-gray-400 hover:bg-gray-50 rounded-full transition-colors">
        <span class="material-icons block text-xl">notifications</span>
        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
      </button>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      <router-outlet />
    </main>

  </div>

</div>
