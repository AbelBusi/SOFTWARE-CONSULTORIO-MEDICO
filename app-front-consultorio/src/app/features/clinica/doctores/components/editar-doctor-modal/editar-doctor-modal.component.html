@if (doctor && form) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
    (click)="handleClose()"
  >
    <div
      class="relative bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 overflow-hidden flex flex-col"
      style="max-height: 90vh;"
      (click)="$event.stopPropagation()"
    >
      <div class="bg-green-700 px-6 pt-5 pb-5 flex items-center gap-4 shrink-0">
        <div class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center shrink-0">
          <span class="text-white text-base font-semibold">{{ iniciales }}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <svg class="h-4 w-4 text-green-300" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
            <p class="text-green-200 text-xs font-medium uppercase tracking-widest">Editando</p>
          </div>
          <h2 class="text-white text-base font-semibold leading-tight truncate">
            Dr. {{ form.nombre }} {{ form.apellido }}
          </h2>
        </div>
        <button
          type="button"
          (click)="handleClose()"
          class="p-1.5 rounded-md text-green-200 hover:text-white hover:bg-green-600 transition-colors shrink-0"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      @if (saved) {
        <div class="flex items-center gap-2 bg-green-50 border-b border-green-200 text-green-700 px-6 py-3 text-sm font-medium shrink-0">
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          Cambios guardados correctamente.
        </div>
      }

      <form (submit)="handleSubmit($event)" class="flex flex-col flex-1 overflow-hidden">
        <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">

          <div class="space-y-3">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
              Datos personales
            </p>
            <div class="grid grid-cols-2 gap-3">
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                  </svg>
                  Nombre
                </label>
                <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form.nombre" name="nombre" required />
              </div>
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                  </svg>
                  Apellido
                </label>
                <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form.apellido" name="apellido" required />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-6.294 0 2.25 2.25 0 0 1-1.24-2.03V13.5a2.25 2.25 0 0 1 2.25-2.25h3.5A2.25 2.25 0 0 1 15 13.5v.081a2.25 2.25 0 0 1-1.206 2.03.115.115 0 0 1-.002.005Z" />
                  </svg>
                  CMP
                </label>
                <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form.cmp" name="cmp" required />
              </div>
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                  </svg>
                  Estado
                </label>
                <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form.estado" name="estado">
                  <option value="activo">Activo</option>
                  <option value="inactivo">Inactivo</option>
                </select>
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
              Especialidad
            </p>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                </svg>
                Especialidad
              </label>
              <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form.especialidad" name="especialidad" required>
                @for (esp of especialidades; track esp) {
                  <option [value]="esp">{{ esp }}</option>
                }
              </select>
            </div>
          </div>

          <div class="space-y-3">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
              Contacto
            </p>
            <div class="grid grid-cols-2 gap-3">
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-1.514 2.018a14.977 14.977 0 0 1-6.538-6.538l2.018-1.514c.361-.272.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
                  </svg>
                  Teléfono
                </label>
                <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form.telefono" name="telefono" />
              </div>
              <div class="space-y-1.5">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                  </svg>
                  Email
                </label>
                <input type="email" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form.email" name="email" />
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
              Horario
            </p>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                Turno
              </label>
              <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form.turno" name="turno">
                <option>Mañana</option>
                <option>Tarde</option>
                <option>Noche</option>
                <option>Completo</option>
              </select>
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.625 21h12.75A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.625 9h12.75A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                </svg>
                Días de atención
              </label>
              <div class="flex gap-2 flex-wrap pt-0.5">
                @for (dia of dias; track dia) {
                  <button
                    type="button"
                    (click)="toggleDia(dia)"
                    [ngClass]="isDiaActive(dia)
                      ? 'bg-green-700 text-white border-green-700'
                      : 'bg-white text-gray-500 border-gray-200 hover:border-green-300 hover:text-green-700'"
                    class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition-colors"
                  >
                    {{ dia }}
                  </button>
                }
              </div>
            </div>
          </div>
        </div>

        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">
          <button
            type="button"
            (click)="handleClose()"
            class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="px-5 py-2 bg-green-700 text-white text-sm font-medium rounded-lg hover:bg-green-800 transition-colors shadow-sm"
          >
            Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </div>
}
