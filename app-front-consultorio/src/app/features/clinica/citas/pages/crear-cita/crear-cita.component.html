<div class="animate-fade-in w-full max-w-5xl mx-auto">
  <div class="page-header">
    <h2>Nueva cita médica</h2>
    <p>Complete los datos para agendar una consulta</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <form [formGroup]="citaForm" (ngSubmit)="handleSubmit()" class="lg:col-span-2 card p-6 space-y-6">
      <section>
        <h3 class="text-xs font-bold text-teal-700 uppercase tracking-wider mb-4 flex items-center gap-2">
          <span class="material-icons text-base">groups</span> Personal y paciente
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Recepcionista</label>
            <select formControlName="recepcionistaId" class="input-field" [class.border-red-300]="hasError('recepcionistaId')">
              <option [value]="0">Seleccionar...</option>
              @for (r of recepcionistas; track r.id) {
                <option [value]="r.id">{{ r.nombre }}</option>
              }
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Paciente</label>
            <select formControlName="pacienteId" class="input-field" [class.border-red-300]="hasError('pacienteId')">
              <option [value]="0">Seleccionar...</option>
              @for (p of pacientes; track p.id) {
                <option [value]="p.id">{{ p.nombre }}</option>
              }
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Doctor</label>
            <select formControlName="doctorId" class="input-field" [class.border-red-300]="hasError('doctorId')">
              <option [value]="0">Seleccionar...</option>
              @for (d of doctores; track d.id) {
                <option [value]="d.id">{{ d.nombre }}</option>
              }
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Especialidad</label>
            <select formControlName="especialidadId" class="input-field" [class.border-red-300]="hasError('especialidadId')">
              <option [value]="0">Seleccionar...</option>
              @for (e of especialidades; track e.id) {
                <option [value]="e.id">{{ e.nombre }}</option>
              }
            </select>
          </div>
        </div>
      </section>

      <section>
        <h3 class="text-xs font-bold text-teal-700 uppercase tracking-wider mb-4 flex items-center gap-2">
          <span class="material-icons text-base">event</span> Detalles de la cita
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Fecha</label>
            <input type="date" formControlName="fecha" class="input-field" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Hora inicio</label>
            <input type="time" formControlName="horaInicio" class="input-field" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Hora fin</label>
            <input type="time" formControlName="horaSalida" class="input-field" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Costo (S/.)</label>
            <input type="number" formControlName="costo" class="input-field" min="1" />
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase mb-1 block">Motivo</label>
          <input formControlName="motivo" placeholder="Ej: Control cardiológico" class="input-field" />
        </div>
      </section>

      <div class="flex justify-end pt-2">
        <button type="submit" [disabled]="loading" class="btn-primary px-8 py-3">
          @if (loading) {
            <span class="h-4 w-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          }
          Registrar cita
        </button>
      </div>
    </form>

    <div class="card p-6 bg-gradient-to-br from-teal-700 to-teal-900 text-white border-0 h-fit sticky top-24">
      <h3 class="font-display text-lg font-bold mb-6">Vista previa</h3>
      <div class="space-y-4">
        <div class="bg-white/10 rounded-xl p-4">
          <p class="text-[10px] uppercase opacity-70 font-bold">Fecha / Hora</p>
          <p class="text-sm font-medium mt-1">
            {{ valuePreview.fecha || '--/--/--' }} · {{ valuePreview.horaInicio || '--:--' }}
          </p>
        </div>
        <div class="bg-white/10 rounded-xl p-4">
          <p class="text-[10px] uppercase opacity-70 font-bold">Total</p>
          <p class="text-3xl font-bold mt-1">S/. {{ costoActual.toFixed(2) }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
