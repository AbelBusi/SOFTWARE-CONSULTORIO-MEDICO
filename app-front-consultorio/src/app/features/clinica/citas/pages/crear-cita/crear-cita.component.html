<div class="relative">

  @if (isSaving) {
    <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center animate-fade-in">
      <div class="bg-white rounded border border-gray-200 shadow-xl flex flex-col items-center gap-4 px-12 py-8 max-w-sm w-full">
        <div class="h-10 w-10 border-4 border-gray-100 border-t-[#0d6b68] rounded-full animate-spin"></div>
        <div class="text-center">
          <p class="text-xs font-bold text-gray-800 uppercase tracking-widest">Procesando Operación</p>
          <p class="text-[11px] text-gray-500 mt-1">Registrando cita en el sistema...</p>
        </div>
      </div>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate class="space-y-6">

    <div class="bg-[#fdfdfd] border border-gray-200 rounded shadow-sm overflow-hidden">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-100 bg-gray-50/50">
        <span class="material-icons text-base text-[#0d6b68] select-none">assignment_ind</span>
        <h3 class="text-xs font-bold text-gray-700 uppercase tracking-widest">Asignación Base</h3>
      </div>

      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            Recepcionista Encargado <span class="text-[#0d6b68] text-xs">*</span>
          </label>
          <div class="relative">
            <select formControlName="recepcionistaId"
                    class="w-full appearance-none text-xs px-3 py-2.5 pr-8 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                    [class.border-red-400]="isInvalid('recepcionistaId')"
                    [class.border-gray-200]="!isInvalid('recepcionistaId')">
              <option value="" disabled>SELECCIONE RECEPCIONISTA</option>
              @for (rep of recepcionistas; track rep.id) {
                <option [value]="rep.id">{{ rep.nombreRecepcionista }}</option>
              }
            </select>
            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 material-icons text-[16px] text-gray-400">expand_more</span>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            Paciente <span class="text-[#0d6b68] text-xs">*</span>
          </label>
          <div class="relative">
            <select formControlName="pacienteId"
                    class="w-full appearance-none text-xs px-3 py-2.5 pr-8 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                    [class.border-red-400]="isInvalid('pacienteId')"
                    [class.border-gray-200]="!isInvalid('pacienteId')">
              <option value="" disabled>SELECCIONE PACIENTE</option>
              @for (pac of pacientes; track pac.idPaciente) {
                <option [value]="pac.idPaciente">{{ pac.nombrePaciente }}</option>
              }
            </select>
            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 material-icons text-[16px] text-gray-400">expand_more</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-[#fdfdfd] border border-gray-200 rounded shadow-sm overflow-hidden">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-100 bg-gray-50/50">
        <span class="material-icons text-base text-[#0d6b68] select-none">local_hospital</span>
        <h3 class="text-xs font-bold text-gray-700 uppercase tracking-widest">Especialidad y Personal Médico</h3>
      </div>

      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            Especialidad Médica <span class="text-[#0d6b68] text-xs">*</span>
          </label>
          <div class="relative">
            <select formControlName="especialidadId"
                    class="w-full appearance-none text-xs px-3 py-2.5 pr-8 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                    [class.border-red-400]="isInvalid('especialidadId')"
                    [class.border-gray-200]="!isInvalid('especialidadId')">
              <option value="" disabled>SELECCIONE ESPECIALIDAD</option>
              @for (esp of especialidades; track esp.idEspecialidad) {
                <option [value]="esp.idEspecialidad">{{ esp.nombreEspecialidad }}</option>
              }
            </select>
            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 material-icons text-[16px] text-gray-400">expand_more</span>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            Doctor Asignado <span class="text-[#0d6b68] text-xs">*</span>
          </label>
          <div class="relative">
            <select formControlName="doctorId"
                    class="w-full appearance-none text-xs px-3 py-2.5 pr-8 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68] disabled:bg-gray-50 disabled:text-gray-400 disabled:border-gray-200 disabled:cursor-not-allowed"
                    [class.border-red-400]="isInvalid('doctorId')"
                    [class.border-gray-200]="!isInvalid('doctorId')"
                    [attr.disabled]="!form.get('especialidadId')?.value ? true : null">
              <option value="" disabled>
                {{ form.get('especialidadId')?.value ? 'SELECCIONE MÉDICO' : 'REQUIERE ESPECIALIDAD' }}
              </option>
              @for (doc of doctores; track doc.id) {
                <option [value]="doc.id">{{ doc.nombres }}</option>
              }
            </select>
            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 material-icons text-[16px] text-gray-400">expand_more</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-[#fdfdfd] border border-gray-200 rounded shadow-sm overflow-hidden">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-100 bg-gray-50/50">
        <span class="material-icons text-base text-[#0d6b68] select-none">schedule</span>
        <h3 class="text-xs font-bold text-gray-700 uppercase tracking-widest">Programación y Costo</h3>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="space-y-2 md:col-span-2 border-l-2 border-[#0d6b68] pl-3">
            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
              Fecha de Cita <span class="text-[#0d6b68] text-xs">*</span>
            </label>
            <input type="date" formControlName="fecha"
                   class="w-full text-xs px-3 py-2.5 rounded bg-white text-gray-800 font-bold tracking-wider transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                   [class.border-red-400]="isInvalid('fecha')"
                   [class.border-gray-200]="!isInvalid('fecha')" />
          </div>

          <div class="space-y-2 border-l-2 border-gray-300 pl-3">
            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
              Hora de Entrada <span class="text-[#0d6b68] text-xs">*</span>
            </label>
            <input type="time" formControlName="horaInicio"
                   class="w-full text-xs px-3 py-2.5 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                   [class.border-red-400]="isInvalid('horaInicio')"
                   [class.border-gray-200]="!isInvalid('horaInicio')" />
          </div>

          <div class="space-y-2 border-l-2 border-gray-300 pl-3">
            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
              Hora de Salida <span class="text-[#0d6b68] text-xs">*</span>
            </label>
            <input type="time" formControlName="horaSalida"
                   class="w-full text-xs px-3 py-2.5 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                   [class.border-red-400]="isInvalid('horaSalida')"
                   [class.border-gray-200]="!isInvalid('horaSalida')" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
          <div class="space-y-2 md:col-span-2">
            <div class="flex justify-between items-center">
              <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                Motivo de Consulta <span class="text-[#0d6b68] text-xs">*</span>
              </label>
              <span class="text-[10px] font-mono text-gray-400 select-none">
                {{ form.get('motivo')?.value?.length || 0 }}/500
              </span>
            </div>
            <textarea formControlName="motivo" rows="2" maxlength="500"
                      placeholder="Describa los síntomas o motivo de la consulta..."
                      class="w-full text-xs px-3 py-2.5 rounded bg-white text-gray-800 font-medium transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68] resize-none leading-relaxed"
                      [class.border-red-400]="isInvalid('motivo')"
                      [class.border-gray-200]="!isInvalid('motivo')"></textarea>
          </div>

          <div class="space-y-2">
            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">
              Costo Total (PEN) <span class="text-[#0d6b68] text-xs">*</span>
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-bold select-none">S/.</span>
              <input type="number" formControlName="costo" step="0.01" min="0.01" placeholder="0.00"
                     class="w-full text-xs pl-9 pr-3 py-2.5 rounded bg-white text-gray-800 font-bold transition-colors outline-none border hover:border-[#0d6b68] focus:border-[#0d6b68]"
                     [class.border-red-400]="isInvalid('costo')"
                     [class.border-gray-200]="!isInvalid('costo')" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end pt-2">
      <button type="submit"
              [disabled]="isSaving"
              class="flex items-center gap-2 px-8 py-3 bg-[#0d6b68] text-white text-[11px] font-bold rounded hover:bg-[#0a5452] active:bg-[#094e4b] transition-colors uppercase tracking-widest disabled:opacity-40 disabled:cursor-not-allowed">
        <span class="material-icons text-sm">event_available</span>
        Registrar Cita Médica
      </button>
    </div>
  </form>
</div>
