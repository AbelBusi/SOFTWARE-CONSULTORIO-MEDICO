<div class="space-y-6">
  <div class="grid grid-cols-1 gap-4">
    <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm flex items-center gap-4">
      <div class="p-3 rounded-lg bg-blue-50">
        <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500">Total Especialidades Activas</p>
        <p class="text-2xl font-bold text-gray-900">{{ totalEspecialidades }}</p>
      </div>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2 w-full md:w-80 shadow-sm focus-within:ring-2 focus-within:ring-green-500/20 transition-all">
      <svg class="h-4 w-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      <input
        class="bg-transparent text-sm text-gray-700 placeholder-gray-400 outline-none w-full"
        placeholder="Buscar especialidad..."
        name="search"
        [(ngModel)]="search"
      />
    </div>
    <button
      (click)="isCrearOpen = true"
      class="w-full sm:w-auto flex items-center justify-center gap-2 bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm shadow-green-200"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
      Nueva Especialidad
    </button>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none hover:text-gray-700 group" (click)="handleSort('nombre')">
            <div class="flex items-center gap-1">
              Especialidad
              <svg [ngClass]="{'text-green-600': sortField === 'nombre', 'text-gray-300 group-hover:text-gray-400': sortField !== 'nombre'}" class="h-3.5 w-3.5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>
            </div>
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Descripción</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Estado</th>
          <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
        <tr
          *ngFor="let e of filteredEspecialidades"
          (click)="seleccionarEspecialidad(e)"
          [ngClass]="{
              'bg-green-50/80': especialidadSeleccionada?.id === e.id,
              'hover:bg-green-50/40': especialidadSeleccionada?.id !== e.id
            }"
          class="transition-colors group cursor-pointer"
        >
          <td class="px-4 py-4 font-medium text-gray-900">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-green-100 border border-green-200 flex items-center justify-center shrink-0">
                <svg class="h-5 w-5 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
              </div>
              <span class="font-bold text-gray-900 leading-none">{{ e.nombre }}</span>
            </div>
          </td>
          <td class="px-4 py-4 text-gray-500 max-w-xs truncate">
            {{ e.descripcion }}
          </td>
          <td class="px-4 py-4">
              <span [ngClass]="{
                'bg-green-50 text-green-700 border-green-200': e.estado === 1,
                'bg-gray-50 text-gray-500 border-gray-200': e.estado !== 1
              }" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold border">
                {{ e.estado === 1 ? 'Operativo' : 'Mantenimiento' }}
              </span>
          </td>
          <td class="px-4 py-4 text-right">
            <div class="flex justify-end gap-2">
              <button
                (click)="setEspecialidadVer(e); $event.stopPropagation()"
                class="p-1.5 text-gray-400 hover:text-green-600 hover:bg-green-100 rounded-md transition-all"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
              <button
                (click)="setEspecialidadEditar(e); $event.stopPropagation()"
                class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-100 rounded-md transition-all"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-crear-especialidad-modal
  [isOpen]="isCrearOpen"
  (onClose)="isCrearOpen = false"
></app-crear-especialidad-modal>

<app-editar-especialidad-modal
  [especialidad]="especialidadEditar"
  [isOpen]="!!especialidadEditar"
  (onClose)="especialidadEditar = null"
></app-editar-especialidad-modal>

<app-ver-detalle-especialidad-modal
  *ngIf="especialidadVer"
  [especialidad]="especialidadVer"
  (close)="especialidadVer = null"
></app-ver-detalle-especialidad-modal>
