<div class="space-y-6">

  <!-- Resumen -->
  <div class="bg-white border border-gray-200 rounded-lg px-5 py-4 flex items-center gap-4">
    <div
      class="w-11 h-11 rounded-md bg-[#58595B] flex items-center justify-center shrink-0">
      <span class="material-icons text-white text-[22px]">
        medical_services
      </span>
    </div>

    <div>
      <p
        class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
        Especialidades activas
      </p>

      <p class="text-2xl font-bold text-gray-900 mt-0.5">
        {{ totalEspecialidades }}
      </p>
    </div>
  </div>


  <!-- Barra de herramientas -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">

    <!-- Buscar -->
    <div
      class="flex items-center gap-2 bg-white border border-gray-300 rounded-md px-3 h-10 w-full md:w-80 focus-within:border-[#58595B] focus-within:ring-1 focus-within:ring-[#58595B] transition-colors">
      <span class="material-icons text-gray-400 text-[20px]">
        search
      </span>

      <input
        type="text"
        name="search"
        [(ngModel)]="search"
        placeholder="Buscar especialidad..."
        class="bg-transparent text-sm text-gray-700 placeholder-gray-400 outline-none w-full"
      />
    </div>


    <!-- Nueva especialidad -->
    <button
      type="button"
      (click)="isCrearOpen = true"
      class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 h-10 rounded-md bg-[#D9182A] hover:bg-[#B81424] text-white text-sm font-semibold transition-colors">
      <span class="material-icons text-[20px]">
        add
      </span>

      Nueva especialidad
    </button>

  </div>


  <!-- Tabla estándar -->
  <app-custom-table
    [data]="especialidadesFiltradas"
    [columns]="columns"
    [loading]="cargando"
    [sortField]="sortField"
    (sort)="handleSort($event)"
    (rowClick)="seleccionarEspecialidad($event)"
    (deleteAction)="eliminarEspecialidad($event)"
  >

    <!-- Especialidad -->
    <ng-template
      #customColumn
      let-row
      let-field="field"
    >

      @if (field === 'nombre') {

        <div class="flex items-center gap-3">

          <div
            class="w-9 h-9 rounded-md bg-gray-100 flex items-center justify-center shrink-0">
            <span class="material-icons text-[#58595B] text-[19px]">
              medical_services
            </span>
          </div>

          <span
            class="font-semibold text-gray-800 group-hover:text-[#D9182A] transition-colors">
            {{ row.nombre }}
          </span>

        </div>

      }

      @if (field === 'estado') {

        <span
          [ngClass]="
            row.estado === 1
              ? 'bg-[#0d6b68]/10 text-[#0d6b68] border-[#0d6b68]/20'
              : 'bg-[#D9182A]/10 text-[#D9182A] border-[#D9182A]/20'
          "
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border uppercase tracking-wide">

          <span
            class="w-1.5 h-1.5 rounded-full"
            [ngClass]="
              row.estado === 1
                ? 'bg-[#0d6b68]'
                : 'bg-[#D9182A]'
            "
          ></span>

          {{ row.estado === 1 ? 'Activo' : 'Desactivado' }}

        </span>

      }

    </ng-template>

  </app-custom-table>


</div>


<!-- Crear -->
@if (isCrearOpen) {

  <app-crear-especialidad-modal
    [isOpen]="isCrearOpen"
    (onClose)="isCrearOpen = false"
    (onEspecialidadCreada)="handleEspecialidadCreada()"
  ></app-crear-especialidad-modal>

}

@if (especialidadEditar) {

  <app-editar-especialidad-modal
    [especialidad]="especialidadEditar"
    [isOpen]="true"
    (onClose)="especialidadEditar = null"
    (onEspecialidadEditada)="handleEspecialidadEditada($event)"
  ></app-editar-especialidad-modal>

}

<!-- Ver -->
@if (especialidadVer) {

  <app-ver-detalle-especialidad-modal
    [especialidad]="especialidadVer"
    (close)="especialidadVer = null"
  ></app-ver-detalle-especialidad-modal>

}
