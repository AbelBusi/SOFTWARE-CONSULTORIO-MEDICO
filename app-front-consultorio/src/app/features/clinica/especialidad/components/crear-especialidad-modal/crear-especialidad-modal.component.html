<div *ngIf="isOpen" class="relative z-50">

  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md transform overflow-hidden rounded border border-slate-200 bg-white p-6 shadow-sm transition-all">

        <div class="flex justify-between items-center mb-5">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-teal-600 flex items-center justify-center">
              <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            Nueva Especialidad
          </h3>
          <button (click)="handleClose()" class="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Nombre de la Especialidad</label>
              <span class="text-[11px] font-medium text-slate-400" [class.text-red-500]="especialidadForm.nombre.length >= 40">
                {{ especialidadForm.nombre.length || 0 }}/40
              </span>
            </div>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="especialidadForm.nombre"
              #nombreInput="ngModel"
              maxlength="40"
              class="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-slate-400 transition-colors"
              [class.border-red-200]="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)"
              placeholder="Ej. Odontología"
              required
            />
            <div *ngIf="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)" class="text-xs text-red-600 font-medium">
              El nombre es obligatorio.
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Descripción</label>
              <!-- Contador dinámico 0/100 -->
              <span class="text-[11px] font-medium text-slate-400" [class.text-red-500]="especialidadForm.descripcion.length >= 100">
                {{ especialidadForm.descripcion.length || 0 }}/100
              </span>
            </div>
            <textarea
              name="descripcion"
              [(ngModel)]="especialidadForm.descripcion"
              #descInput="ngModel"
              maxlength="100"
              class="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-slate-400 transition-colors h-24 resize-none"
              [class.border-red-200]="descInput.invalid && (descInput.dirty || descInput.touched)"
              placeholder="Breve descripción del área..."
              required></textarea>
            <div *ngIf="descInput.invalid && (descInput.dirty || descInput.touched)" class="text-xs text-red-600 font-medium">
              La descripción es obligatoria.
            </div>
          </div>

          <div class="flex gap-3 pt-2">
            <button
              type="button"
              (click)="handleClose()"
              class="flex-1 px-4 py-2 text-sm font-medium text-slate-600 bg-slate-50 hover:bg-slate-100 rounded border border-slate-200 transition-colors">
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!f.form.valid"
              class="flex-1 px-4 py-2 text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 rounded transition-colors disabled:opacity-50">
              Guardar Especialidad
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
