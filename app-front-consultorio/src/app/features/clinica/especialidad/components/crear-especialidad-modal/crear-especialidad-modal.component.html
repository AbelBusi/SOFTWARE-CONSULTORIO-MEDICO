<div *ngIf="isOpen" class="relative z-50">

  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-xl transition-all">

        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
            <svg class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Nueva Especialidad
          </h3>
          <button (click)="handleClose()" class="p-1 rounded-full hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">NOMBRE</label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="especialidadForm.nombre"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-500/20 outline-none transition-all"
              placeholder="Ej. Odontología"
              required />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">DESCRIPCIÓN</label>
            <textarea
              name="descripcion"
              [(ngModel)]="especialidadForm.descripcion"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-500/20 outline-none h-24 resize-none"
              placeholder="Breve descripción del área..."
              required></textarea>
          </div>

          <div class="flex gap-3 pt-4">
            <button
              type="button"
              (click)="handleClose()"
              class="flex-1 px-4 py-2 text-sm font-medium text-gray-500 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
              Cancelar
            </button>
            <button
              type="submit"
              class="flex-1 px-4 py-2 text-sm font-medium text-white bg-green-700 rounded-lg hover:bg-green-800 transition-colors shadow-sm shadow-green-200">
              Guardar Especialidad
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
