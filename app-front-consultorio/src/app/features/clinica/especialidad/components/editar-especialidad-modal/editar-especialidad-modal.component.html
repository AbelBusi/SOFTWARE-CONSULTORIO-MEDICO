<div *ngIf="isOpen" class="relative z-50">
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md transform overflow-hidden rounded bg-white p-6 border border-slate-200 shadow-xl transition-all">

        <div class="flex justify-between items-start mb-6">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-teal-50 flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-slate-900">Editar Especialidad</h3>
          </div>
          <button (click)="handleClose()" [disabled]="cargando" class="p-1.5 rounded text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition-colors disabled:opacity-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form (ngSubmit)="onSubmit()" #editForm="ngForm" class="space-y-4">
          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Nombre</label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="especialidadForm.nombre"
              required
              maxlength="40"
              class="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm text-slate-700 outline-none focus:border-slate-400 transition-colors"
            />
            <div class="text-right text-[10px] text-slate-400 mt-1">
              {{ especialidadForm.nombre.length }}/40
            </div>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Descripción</label>
            <textarea
              name="descripcion"
              [(ngModel)]="especialidadForm.descripcion"
              required
              maxlength="100"
              rows="3"
              class="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm text-slate-700 outline-none focus:border-slate-400 transition-colors resize-none"
            ></textarea>
            <div class="text-right text-[10px] text-slate-400 mt-1">
              {{ especialidadForm.descripcion.length }}/100
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
            <button
              type="button"
              (click)="handleClose()"
              [disabled]="cargando"
              class="px-4 py-2 border border-slate-200 rounded text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors disabled:opacity-50"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!editForm.form.valid || cargando"
              class="flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded text-sm font-semibold transition-colors disabled:opacity-50"
            >
              <span *ngIf="cargando" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Guardar Cambios
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
