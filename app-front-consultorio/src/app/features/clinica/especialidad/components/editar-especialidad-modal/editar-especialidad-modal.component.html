<div *ngIf="isOpen && especialidad" class="relative z-50">

  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">

      <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-xl transition-all">

        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
            <svg class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Editar Especialidad
          </h3>
          <button (click)="handleClose()" class="p-1 rounded-full hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">NOMBRE</label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="especialidadForm.nombre"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500/20 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">ESTADO OPERATIVO</label>
            <div class="flex gap-4 p-2 bg-gray-50 rounded-lg">
              <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
                <input
                  type="radio"
                  name="estado"
                  [checked]="especialidadForm.estado === 1"
                  (change)="especialidadForm.estado = 1"
                  class="rounded text-green-600 focus:ring-green-500" /> Activo
              </label>
              <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
                <input
                  type="radio"
                  name="estado"
                  [checked]="especialidadForm.estado === 0"
                  (change)="especialidadForm.estado = 0"
                  class="rounded text-green-600 focus:ring-green-500" /> Inactivo
              </label>
            </div>
          </div>

          <div class="flex gap-3 pt-4">
            <button
              type="button"
              (click)="handleClose()"
              class="flex-1 px-4 py-2 text-sm font-medium text-gray-500 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
              Descartar
            </button>
            <button
              type="submit"
              class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-sm shadow-blue-100">
              Actualizar Datos
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
