<div *ngIf="especialidad" class="relative z-50">
  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity duration-300"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-xl transition-all duration-300">

        <div class="flex justify-between items-start mb-6">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-teal-50 rounded-lg">
              <span class="material-icons text-teal-600">local_hospital</span>
            </div>
            <h3 class="text-xl font-bold text-gray-900">Detalle de especialidad</h3>
          </div>
          <button (click)="onClose()" class="p-1 rounded-full hover:bg-gray-100 transition-colors">
            <span class="material-icons text-gray-400">close</span>
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Nombre</label>
            <p class="text-lg font-semibold text-gray-800">{{ especialidad.nombre }}</p>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Descripción</label>
            <p class="text-sm text-gray-600 leading-relaxed">{{ especialidad.descripcion }}</p>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-gray-100">
            <span class="text-xs text-gray-500">ID #{{ especialidad.id }}</span>
            <span [ngClass]="{
              'badge-active': especialidad.estado === 1,
              'badge-inactive': especialidad.estado !== 1
            }" class="badge">
              {{ especialidad.estado === 1 ? 'Operativo' : 'Inactivo' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
