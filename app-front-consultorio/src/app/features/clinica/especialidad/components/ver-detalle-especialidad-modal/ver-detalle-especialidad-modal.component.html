<div *ngIf="especialidad" class="relative z-50">
  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity duration-300"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-xl transition-all duration-300 scale-100 opacity-100">

        <div class="flex justify-between items-start mb-6">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-green-50 rounded-lg">
              <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900">Detalle de Área</h3>
          </div>
          <button (click)="onClose()" class="p-1 rounded-full hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Nombre de Especialidad</label>
            <p class="text-lg font-semibold text-gray-800">{{ especialidad.nombre }}</p>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Descripción</label>
            <p class="text-sm text-gray-600 leading-relaxed">{{ especialidad.descripcion }}</p>
          </div>

          <div class="grid grid-cols-2 gap-4 pt-2">
            <div class="flex items-center gap-2">
              <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-sm text-gray-700">{{ especialidad.piso }}</span>
            </div>
            <div class="flex items-center gap-2">
              <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <span class="text-sm text-gray-700">{{ especialidad.numDoctores }} Doctores</span>
            </div>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-gray-100">
            <div class="flex items-center gap-2">
              <svg class="h-4 w-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
              </svg>
              <span class="text-xs font-bold text-amber-600">Demanda {{ especialidad.demanda }}</span>
            </div>
            <span [ngClass]="{
              'bg-green-50 text-green-700': especialidad.estado === 'activo',
              'bg-gray-50 text-gray-500': especialidad.estado === 'inactivo'
            }" class="px-3 py-1 rounded-full text-xs font-bold">
              {{ especialidad.estado === 'activo' ? 'Operativo' : 'Inactivo' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
