<div *ngIf="especialidad" class="relative z-50">
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity duration-300"></div>

  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md transform overflow-hidden rounded bg-white p-6 border border-slate-200 shadow-xl transition-all duration-300">

        <div class="flex justify-between items-start mb-6">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-teal-50 flex items-center justify-center shrink-0">
              <svg class="h-5 w-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 10.5V20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9.5M3 10.5l9-7 9 7M12 12v6m-3-3h6" />
              </svg>
            </div>
            <h3 class="text-base font-bold text-slate-900">Detalle de especialidad</h3>
          </div>
          <button (click)="onClose()" class="p-1.5 rounded text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Nombre</label>
            <p class="text-sm font-bold text-slate-900">{{ especialidad.nombre }}</p>
          </div>

          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Descripción</label>
            <p class="text-sm text-slate-500 leading-relaxed">{{ especialidad.descripcion }}</p>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-slate-100">
            <span class="text-xs font-medium text-slate-400">ID #{{ especialidad.id }}</span>
            <span [ngClass]="{
                'bg-teal-50 text-teal-700 border-teal-200': especialidad.estado === 1,
                'bg-slate-50 text-slate-500 border-slate-200': especialidad.estado !== 1
              }" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold border uppercase tracking-wider">
              {{ especialidad.estado === 1 ? 'Activo' : 'Desactivado' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
