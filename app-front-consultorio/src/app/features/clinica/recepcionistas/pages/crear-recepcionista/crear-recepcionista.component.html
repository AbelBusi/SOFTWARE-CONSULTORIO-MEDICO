<div class="animate-fade-in max-w-3xl mx-auto space-y-6">
  <div class="page-header">
    <h2>Nuevo recepcionista</h2>
    <p>Registre los datos personales y el código de empleado</p>
  </div>

  @if (alert(); as a) {
    <div
      class="rounded-lg px-4 py-3 text-sm"
      [class.bg-emerald-50]="a.type === 'success'"
      [class.text-emerald-800]="a.type === 'success'"
      [class.bg-red-50]="a.type === 'error'"
      [class.text-red-800]="a.type === 'error'"
    >
      {{ a.msg }}
    </div>
  }

  <form class="card space-y-6" (submit)="handleSubmit($event)">
    <div>
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Datos laborales</h3>
      <label class="block text-sm text-slate-600 mb-1">Código de empleado *</label>
      <input class="input-field" [(ngModel)]="form.codigoEmpleado" name="codigo" required />
    </div>

    <div>
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Datos personales</h3>
      <div class="mb-4 p-4 rounded-xl bg-slate-50 border border-slate-100">
        <app-consulta-dni
          [dni]="form.persona.dni"
          (dniChange)="form.persona.dni = $event"
          (datosCargados)="onDatosReniec($event)"
        />
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-600 mb-1">Género</label>
          <select class="input-field" [(ngModel)]="form.persona.genero" name="genero">
            @for (g of generos; track g) {
              <option [value]="g">{{ g }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Nombres *</label>
          <input class="input-field" [(ngModel)]="form.persona.nombre" name="nombre" required />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Apellidos *</label>
          <input class="input-field" [(ngModel)]="form.persona.apellidos" name="apellidos" required />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Fecha de nacimiento</label>
          <input type="date" class="input-field" [(ngModel)]="form.persona.fechaNacimiento" name="fecha" />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Teléfono</label>
          <input class="input-field" [(ngModel)]="form.persona.telefono" name="telefono" />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Correo</label>
          <input type="email" class="input-field" [(ngModel)]="form.persona.correo" name="correo" />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Nacionalidad</label>
          <input class="input-field" [(ngModel)]="form.persona.nacionalidad" name="nacionalidad" />
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <a routerLink="/dashboard/recepcionistas" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Registrar recepcionista
        }
      </button>
    </div>
  </form>
</div>
