<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
  (click)="close.emit()"
>
  <div
    class="relative bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 overflow-hidden flex flex-col"
    style="max-height: 90vh;"
    (click)="$event.stopPropagation()"
  >
    <div class="bg-green-700 px-6 py-5 flex items-center gap-4 shrink-0">
      <div class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center shrink-0">
        <span class="text-white text-base font-semibold">{{ iniciales() }}</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="material-icons text-green-300 text-sm">edit</span>
          <p class="text-green-200 text-xs font-medium uppercase tracking-widest">Editando</p>
        </div>
        <h2 class="text-white text-base font-semibold leading-tight truncate">
          {{ form().nombre }} {{ form().apellidos }}
        </h2>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="p-1.5 rounded-md text-green-200 hover:text-white hover:bg-green-600 transition-colors shrink-0"
      >
        <span class="material-icons block text-xl">close</span>
      </button>
    </div>

    @if (saved()) {
      <div class="flex items-center gap-2 bg-green-50 border-b border-green-200 text-green-700 px-6 py-3 text-sm font-medium shrink-0">
        <span class="material-icons text-green-600 text-base shrink-0">check_circle</span>
        Cambios guardados correctamente.
      </div>
    }

    <form (ngSubmit)="handleSubmit()" class="flex flex-col flex-1 overflow-hidden">
      <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">

        <div class="space-y-3">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
            Datos personales
          </p>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">person</span>
                Nombre
              </label>
              <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().nombre" name="nombre" required />
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">person</span>
                Apellidos
              </label>
              <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().apellidos" name="apellidos" required />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">badge</span>
                DNI
              </label>
              <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().dni" name="dni" maxLength="8" required />
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">calendar_month</span>
                Fecha de nacimiento
              </label>
              <input type="date" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().fechaNacimiento" name="fechaNacimiento" required />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">wc</span>
                Género
              </label>
              <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form().genero" name="genero">
                <option>Masculino</option>
                <option>Femenino</option>
                <option>Otro</option>
              </select>
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">gpp_good</span>
                Estado
              </label>
              <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form().estado" name="estado">
                <option [ngValue]="1">Activo</option>
                <option [ngValue]="0">Inactivo</option>
              </select>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest pb-1 border-b border-gray-100">
            Contacto e Identidad
          </p>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">phone</span>
                Teléfono
              </label>
              <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().telefono" name="telefono" />
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">mail</span>
                Correo electrónico
              </label>
              <input type="email" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().correo" name="correo" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">public</span>
                Nacionalidad
              </label>
              <input class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" [(ngModel)]="form().nacionalidad" name="nacionalidad" />
            </div>
            <div class="space-y-1.5">
              <label class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <span class="material-icons text-sm text-gray-400">assignment</span>
                Seguro Médico
              </label>
              <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition appearance-none" [(ngModel)]="form().entidadAseguradora" name="entidadAseguradora">
                @for (s of seguros; track s) {
                  <option [value]="s">{{ s }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">
        <button
          type="button"
          (click)="close.emit()"
          class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-5 py-2 bg-green-700 text-white text-sm font-medium rounded-lg hover:bg-green-800 transition-colors shadow-sm"
        >
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
