<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" (click)="close.emit()">
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-2xl mx-4 overflow-hidden" (click)="$event.stopPropagation()">

    <div class="bg-green-700 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-semibold text-base">
          {{ iniciales() }}
        </div>
        <div>
          <h3 class="text-white font-semibold text-base">Modificar Ficha Médica</h3>
          <p class="text-green-200 text-xs">Actualice los campos requeridos por el sistema</p>
        </div>
      </div>
      <button type="button" (click)="close.emit()" class="text-green-200 hover:text-white transition-colors">
        <span class="material-icons block text-xl">close</span>
      </button>
    </div>

    <form (ngSubmit)="handleSubmit()" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">

      <div>
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">1. Datos de Identidad</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nombres</label>
            <input type="text" name="nombre" [(ngModel)]="form().persona.nombre" required maxlength="70"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Apellidos</label>
            <input type="text" name="apellidos" [(ngModel)]="form().persona.apellidos" required maxlength="100"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">DNI (8 dígitos)</label>
            <input type="text" name="dni" [(ngModel)]="form().persona.dni" required minlength="8" maxlength="8" pattern="\d*"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 font-mono text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Género</label>
            <select name="genero" [(ngModel)]="form().persona.genero" required
                    class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800 bg-white">
              @for (g of generos; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Fecha de Nacimiento</label>
            <input type="date" name="fechaNacimiento" [(ngModel)]="form().persona.fechaNacimiento" required
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nacionalidad</label>
            <input type="text" name="nacionalization" [(ngModel)]="form().persona.nacionalidad" required maxlength="50"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
        </div>
      </div>

      <hr class="border-gray-100" />

      <div>
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">2. Información de Contacto</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Teléfono (9 dígitos)</label>
            <input type="text" name="telefono" [(ngModel)]="form().persona.telefono" maxlength="9" pattern="\d*"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Correo Electrónico</label>
            <input type="email" name="correo" [(ngModel)]="form().persona.correo" maxlength="100"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800" />
          </div>
        </div>
      </div>

      <hr class="border-gray-100" />

      <div>
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">3. Cobertura y Seguro</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Entidad Aseguradora</label>
            <select name="entidadAseguradora" [(ngModel)]="form().entidadAseguradora" required
                    class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 text-gray-800 bg-white">
              @for (seguro of seguros; track seguro) {
                <option [value]="seguro">{{ seguro }}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Código de Asegurador</label>
            <input type="text" name="codigoAseguradora" [(ngModel)]="form().codigoAseguradora" required maxlength="20"
                   class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-green-600 font-mono text-gray-800" />
          </div>
        </div>
      </div>

      <div class="pt-4 flex justify-end gap-2 border-t border-gray-100">
        <button type="button" (click)="close.emit()" [disabled]="guardando()"
                class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50">
          Cancelar
        </button>
        <button type="submit" [disabled]="guardando()"
                class="flex items-center gap-2 px-5 py-2 text-sm bg-green-700 text-white rounded-lg hover:bg-green-800 transition-colors font-medium disabled:opacity-50">
          <span class="material-icons text-sm">{{ guardando() ? 'sync' : 'save' }}</span>
          {{ guardando() ? 'Guardando...' : 'Confirmar Cambios' }}
        </button>
      </div>

    </form>
  </div>
</div>
