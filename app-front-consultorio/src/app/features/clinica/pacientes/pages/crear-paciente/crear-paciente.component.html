<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 relative">
  <div *ngIf="alert"
       [ngClass]="{
         'bg-green-50 border-green-200 text-green-800': alert.type === 'success',
         'bg-red-50 border-red-200 text-red-800': alert.type === 'error',
         'bg-amber-50 border-amber-200 text-amber-800': alert.type === 'warning',
         'bg-blue-50 border-blue-200 text-blue-800': alert.type === 'info'
       }"
       class="fixed top-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg animate-in slide-in-from-right-10">

    <svg *ngIf="alert.type === 'success'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    <svg *ngIf="alert.type === 'error'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    <svg *ngIf="alert.type === 'warning'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
    <svg *ngIf="alert.type === 'info'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>

    <span class="text-sm font-medium">{{ alert.msg }}</span>
    <button (click)="closeAlert()" class="ml-2 p-1 hover:bg-black/5 rounded-full">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <div class="lg:col-span-2 space-y-6">
    <form (ngSubmit)="handleSubmit()" #pacienteForm="ngForm" class="space-y-6">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2 mb-4 border-b border-gray-50 pb-3">
          <svg class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.418.835 2.83 2H8.17c.412-1.165 1.524-2 2.83-2z" /></svg>
          Validación RENIEC
        </h3>
        <div class="flex gap-3 items-end">
          <div class="flex-1 space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Número de DNI</label>
            <div class="relative">
              <input [className]="inputCls + ' pl-10'" placeholder="8 dígitos" maxLength="8" name="dni" [(ngModel)]="form.dni" required />
              <svg class="absolute left-3 top-2.5 h-4.5 w-4.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.418.835 2.83 2H8.17c.412-1.165 1.524-2 2.83-2z" /></svg>
            </div>
          </div>
          <button type="button" (click)="handleConsultarDNI()" [disabled]="loading" class="px-4 py-2.5 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-all flex items-center gap-2">
            <div *ngIf="loading" class="h-4 w-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            <svg *ngIf="!loading" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            Consultar
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-5">
        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2 border-b border-gray-50 pb-3">
          <svg class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          Información del Paciente
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase">Nombres</label>
            <input [className]="inputCls" name="nombre" [(ngModel)]="form.nombre" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase">Apellidos</label>
            <input [className]="inputCls" name="apellido" [(ngModel)]="form.apellido" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
              <svg class="inline h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L22 8m-2 5v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4" /></svg>
              Correo Electrónico
            </label>
            <input [className]="inputCls" type="email" name="email" [(ngModel)]="form.email" placeholder="correo@ejemplo.com" />
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
              <svg class="inline h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
              Teléfono
            </label>
            <input [className]="inputCls" name="telefono" [(ngModel)]="form.telefono" placeholder="999 999 999" />
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
            <svg class="inline h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            Dirección Residencial
          </label>
          <input [className]="inputCls" name="direccion" [(ngModel)]="form.direccion" placeholder="Av. Siempre Viva 123..." />
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-5">
        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2 border-b border-gray-50 pb-3">
          <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
          Historial y Seguro
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
              <svg class="inline h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              Entidad Prestadora (Seguro)
            </label>
            <select [className]="selectCls" name="seguro" [(ngModel)]="form.seguro">
              <option value="">Particular (Sin Seguro)</option>
              <option value="sis">SIS</option>
              <option value="essalud">EsSalud</option>
              <option value="rimac">Rimac</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
              <svg class="inline h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
              Grupo Sanguíneo
            </label>
            <select [className]="selectCls" name="grupoSanguineo" [(ngModel)]="form.grupoSanguineo">
              <option value="">No seleccionado</option>
              <option value="O+">O Rh+</option>
              <option value="O-">O Rh-</option>
              <option value="A+">A Rh+</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3">
        <button type="button" (click)="showAlert('info', 'Formulario restablecido.')" class="px-6 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700">Limpiar</button>
        <button type="submit" class="px-8 py-2.5 bg-green-700 text-white text-sm font-bold rounded-lg hover:bg-green-800 shadow-md transition-all active:scale-95">
          Registrar Paciente
        </button>
      </div>
    </form>
  </div>

  <div class="space-y-6">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
      <h4 class="text-sm font-bold text-gray-800 flex items-center gap-2 mb-4">
        <svg class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
        Tutorial de Registro
      </h4>
      <div class="aspect-video bg-gray-900 rounded-lg flex items-center justify-center relative overflow-hidden group cursor-pointer">
        <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center z-10 transition-transform group-hover:scale-110">
          <div class="w-0 h-0 border-t-[6px] border-t-transparent border-l-[10px] border-l-white border-b-[6px] border-b-transparent ml-1"></div>
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      </div>
      <p class="text-[11px] text-gray-400 mt-3 italic text-center">Aprenda a validar datos con RENIEC correctamente.</p>
    </div>
  </div>
</div>
