<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #eef2f7; }
        .form-container {
            max-width: 500px;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="form-container">
    <h3 class="mb-3 text-center">Editar Cita</h3>

    <form th:action="@{/citas/actualizar}" method="post">

        <input type="hidden" name="id" th:value="${cita.id}">

        <div class="mb-3">
            <label>Paciente</label>
            <input type="text" name="paciente" class="form-control" th:value="${cita.paciente}">
        </div>

        <div class="mb-3">
            <label>Doctor</label>
            <input type="text" name="doctor" class="form-control" th:value="${cita.doctor}">
        </div>

        <div class="mb-3">
            <label>Fecha</label>
            <input type="date" name="fecha" class="form-control" th:value="${cita.fecha}">
        </div>

        <button class="btn btn-warning w-100">Actualizar</button>
        <a href="/citas" class="btn btn-secondary w-100 mt-2">Cancelar</a>

    </form>
</div>

</body>
</html>
